name: Daily Audiobook Factory

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Run a short pipeline test (still uploads only if secrets/assets are valid)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 02:00 UTC = 07:00 Pakistan Standard Time
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: audiobook-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          fc-cache -f

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run audiobook factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          TARGET_MINUTES: "45"
          VIDEO_BITRATE: "6000k"
          NARRATION_VOICE: en-US-ChristopherNeural
          FACTORY_TEST_MODE: ${{ github.event.inputs.test == 'true' && 'true' || 'false' }}
        run: python audiobook_factory.py

      - name: Commit advanced queue
        if: success()
        run: |
          if git diff --quiet -- queue.txt; then
            echo "Queue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.txt
          git commit -m "Advance audiobook topic queue [skip ci]"
          git push
